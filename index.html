<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Requete HTTP via utilisation de la web API XMLHTTPRequest</title>
</head>
<body>
    
</body>
</html>
<script>

// 1 - Requete GET


const requete = new XMLHttpRequest();

requete.open("GET", "https://jsonplaceholder.typicode.com/users");
requete.setRequestHeader('Content-Type', 'application/json');

requete.send();

requete.addEventListener("progress", ({target} = progress) => console.log(target));
requete.addEventListener("load", load => console.log("Terminé"));
requete.addEventListener("error", error => console.log("Erreur"));
requete.addEventListener("abort", abort => console.log("Annulée", abort));

// requete.abort() // Ne necessite pas comme dans fetch() d'un objet AbortController

// requete.timeout = 60000; // Définit un timeout

// requete.upload // Permet de suivre le téléchargement d'un fichier

</script>
