<script>

const body = {name: 'promise', status: 'success'};
const rejectBody = {name: 'promise', status: 'failure'};

/**
 * 3 STATES : Pending / Fullfilled / Rejected
 **/ 


// 1 - PENDING
const pending = new Promise(() => {}); // Promise { <state>: "pending" }

// 2 - FULLFILLED
const fulfilled = Promise.resolve('x'); // Promise { <state>: "fulfilled", <value>: "x" }

// 3 - REJECTED
const rejected = Promise.reject('err x'); // Promise { <state>: "rejected", <reason>: "err x" }
// Note : Si la promesse rejected n'est pas traité (caught), elle générera une erreur : Uncaught (in promise)



/**
 * ECRITURES
 **/ 


// 1 - FULLFILLED

Promise.resolve('value x');

new Promise((resolve) => resolve('value x'));


// 2 - REJECTED

Promise.reject('reason x');

new Promise((resolve) => resolve('reason x'));



/**
 * .THEN()
 * .CATCH()
 * .FINALLY()
 **/


// 1 - .THEN()

Promise.resolve('value 1')
.then(res => 'value 2')
// On traite la valeur récupérée de la promesse,
// puis un renvoie une nouvelle valeur qui sera renvoyé dans une nouvelle promesse

// ** Chainage de promesse **

Promise.resolve('value 1')
.then(res => res + ' & value 2')
.then(res => res + ' & value 3')
.then(res => res + ' & value 4')


// 2 - .CATCH()

Promise.reject('reason 1')
.catch(err => {})
// Sans .catch, on perd la récupération de l'erreur & elle générera une erreur : Uncaught (in promise)

// ** Chainage de promesse **

// Les .catch ne s'enchaine pas, 
// mais on peut renvoyer une promesse rejected dans un chainage de .then

Promise.resolve('value 1')
.then(res => res + ' & value 2')
.then(res => Promise.reject('reason xxx')) // Le rejected nous renvoie directement dans le .catch()
.then(res => res + ' & value 4')
.catch(err => err + ' but we still continue') // Renvoie sur une nouvelle fulfilled, que l'on peut enchainer ...
.then(res => {})


/**
 * 3 - .FINALLY()
 **/

Promise.reject('reason x').finally(() => {});
Promise.resolve('value x').finally(() => {});
// Un callback finally ne recevra pas d'argument car on ne peut pas savoir si la promesse a été tenue ou rompue


/**
 * GESTION DE L'ASYNCHRONE
 **/ 


// Simulation d'une requête HTTP

const httpFakeRequest = new Promise((resolve, reject) => {
    // Simule une réponse après 2 sec.
    setTimeout(() => resolve('value x'), 2000)
})

const httpRandomFakeRequest = new Promise((resolve, reject) => {
    // Simule une réponse après 2 sec.
    setTimeout(() => {
        // Renvoie une fulfilled ou rejected aléatoirement
        if (Math.random() * 100 > 50) resolve('value x of httpRandomFakeRequest');
        else reject('reason x of httpRandomFakeRequest');
    }, 2000)
})



/**
 * ASYNC / AWAIT
 **/

// L'expression await interrompt l'exécution d'une fonction asynchrone et attend la résolution d'une promesse.
// Lorsque la promesse est résolue (tenue ou rompue), la valeur est renvoyée et l'exécution de la fonction asynchrone reprend.
// Si la valeur de l'expression n'est pas une promesse, elle est convertie en une promesse résolue ayant cette valeur.

async function asyncFn() {
    const res = await httpRandomFakeRequest;
    // Cette ligne s'éxecute après le traitement du await;
    return res;
    // Si reject, il faut utiliser try catch pour traiter et ne pas faire bloquer le traitement
}

asyncFn()
.then(result => console.log('async : ', result))
