<script>

// 1 - Requete POST


const requete = new XMLHttpRequest();

requete.open("GET", "https://jsonplaceholder.typicode.com/users");
requete.setRequestHeader('Content-Type', 'application/json');

requete.send();

requete.addEventListener("progress", ({target} = progress) => console.log(target));
requete.addEventListener("load", load => console.log("Terminé"));
requete.addEventListener("error", error => console.log("Erreur"));
requete.addEventListener("abort", abort => console.log("Annulée", abort));

// requete.abort()

</script>
