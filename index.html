<script>

// Opérateurs / Conversion / Précédence

// {} + ' bonjour' = [object Object] bonjour

// [] + [] = Empty string

// undefined + ' yo' = undefined yo

let x = 1;
x = (x++, x); // renvoie 2

2 > '3'; // false

42 + ''; // 42
true + false; // 1
12 / '6'; // 126
"a" + 15 + 3; // a153
15 + 3 + "a"; // 18a


// La comparaison d'égalité faible

"1" == 1; // true
"1" == true; // true
null == undefined; // true
0  == false; // true
1 != '1'; // false
1 == [1]; // true
1 == [0]; // false
"" == false; // true
"" == 0; // true
1,2 == [1, 2]; // true

"2" == true; // true
"test" == true; // true
0 == null; // true
0 == undefined; // true
null == false; // true
undefined == false; // true
"test" == NaN; // false


// La comparaison d'égalité stricte

undefined === undefined; // true
null === null; // true
true === true; // true
false === false; // true
'test' === 'test'; // true
0 === 0; // true
0 === false; // false
"" === false; // false
'1' === 1; // false
1,2 === [1, 2]; // false

// Les objets distincts ne sont jamais égaux :
{a: 1} === {a: 1}; // false
[1] === [1]; // false

NaN === NaN; // false


// La comparaison relationnelle

2 > 1; // true
2 > null; // true
0 > null; // false
'4' > 3; // true
2 >= 2; // true
2 > false; // true
true > 0; // true
true > 2; // false


// Operateur logique 

// &&

true && true; // true
2 === 2 && 3 === 3; // true
false && true; // false
true && false; // false

'1' && '2'; // 1

2 && 3; // 3
[] && 4; // 4

false && nimporteQuoi; // false
undefined && nimporteQuoi; // false
0 && nimporteQuoi; // false
'' && nimporteQuoi; // false
NaN && nimporteQuoi; // false
null && nimporteQuoi; // false

// LE OU Logique ||

true || true ; // true
true || false ; // true
false || true ; // true
false || false ; // false

"1" || nimporteQuoi; // '1'
"21312" || nimporteQuoi; // '21312'
[] || nimporteQuoi; // []
{} || nimporteQuoi; // {}
42 || nimporteQuoi; // 42

false || 1; // 1
undefined || 2; // 2
0 || 3; // 3
'' || 4; // 4
NaN || 5; // 5
null || 6; // 6
null || null; // null

// Le NON Logique !!

!true; // false
!false; // true
!""; // true
!"test"; // false
!42; // false

!!false; // false
!!undefined; // false
!!0; // false
!!''; // false
!!NaN; // false
!!null; // false

// Précédence des opérateurs logiques

1 && 2 && 3; // 3
1 && NaN && 3; // NaN
!2 || 'test' && 42; // 42

</script>
