<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fonctions</title>
</head>
<body>
    
</body>
</html>
<script>

// 1 - this & contexte d'execution

function f1() {
    console.log(this); // Window
}

obj = {
    a: function f2() {console.log(this)}, // Object
    b: () => console.log(this) // Window
}

f1();
obj.a();
obj.b();


// 2 - Rest operator

function trier(...nombres) {
    console.log(nombres, arguments);
}

trier(1) // [1] {0: 1}


// 3 - Portée et environnement lexical

let foo = 2;
function b() {
  let foo = 1;
  function a() {
    console.log(foo);
  }
  a();
}
b(); // 1

"use strict";

const objet = {
  maMethode() {
    console.log(this);
  }
};

function a(fonction) {
  fonction();
}

a(objet.maMethode); // true



</script>
