<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promise</title>
</head>

</body>

<h1 id="title">Les promesses</h1>

<script>

const body = {name: 'promise', status: 'success'};
const rejectBody = {name: 'promise', status: 'failure'};

/**
 * 3 STATES : Pending / Fullfilled / Rejected
 **/ 


// 1 - PENDING
const pending = new Promise(() => {}); // Promise { <state>: "pending" }

// 2 - FULLFILLED
const fulfilled = Promise.resolve('x'); // Promise { <state>: "fulfilled", <value>: "x" }

// 3 - REJECTED
const rejected = Promise.reject('err x'); // Promise { <state>: "rejected", <reason>: "err x" }
// Note : Si la promesse rejected n'est pas traité (caught), elle générera une erreur : Uncaught (in promise)



/**
 * ECRITURES
 **/ 


// 1 - FULLFILLED

Promise.resolve('value x');

new Promise((resolve) => resolve('value x'));


// 2 - REJECTED

Promise.reject('reason x');

new Promise((resolve) => resolve('reason x'));



/**
 * .THEN()
 * .CATCH()
 * .FINALLY()
 **/


// 1 - .THEN()

Promise.resolve('value 1')
.then(res => 'value 2')
// On traite la valeur récupérée de la promesse,
// puis un renvoie une nouvelle valeur qui sera renvoyé dans une nouvelle promesse

// ** Chainage de promesse **

Promise.resolve('value 1')
.then(res => res + ' & value 2')
.then(res => res + ' & value 3')
.then(res => res + ' & value 4')


// 2 - .CATCH()

Promise.reject('reason 1')
.catch(err => {})
// Sans .catch, on perd la récupération de l'erreur & elle générera une erreur : Uncaught (in promise)

// ** Chainage de promesse **

// Les .catch ne s'enchaine pas, 
// mais on peut renvoyer une promesse rejected dans un chainage de .then

Promise.resolve('value 1')
.then(res => res + ' & value 2')
.then(res => Promise.reject('reason xxx')) // Le rejected nous renvoie directement dans le .catch()
.then(res => res + ' & value 4')
.catch(err => err + ' but we still continue') // Renvoie sur une nouvelle fulfilled, que l'on peut enchainer ...
.then(res => {})


/**
 * 3 - .FINALLY()
 **/

Promise.reject('reason x').finally(() => {});
Promise.resolve('value x').finally(() => {});
// Un callback finally ne recevra pas d'argument car on ne peut pas savoir si la promesse a été tenue ou rompue


/**
 * GESTION DE L'ASYNCHRONE
 **/ 


// Simulation d'une requête HTTP

const httpRandomFakeRequest = new Promise((resolve, reject) => {
    // Simule une réponse après 2 sec.
    setTimeout(() => {
        // Renvoie une fulfilled ou rejected aléatoirement
        if (Math.random() * 100 > 50) resolve('value x of httpRandomFakeRequest');
        else reject('reason x of httpRandomFakeRequest');
    }, 2000)
})


/**
 * ASYNC / AWAIT
 **/

async function asyncFnReturnsPromiseAnyway() {
    return 'bonjour'; // S'encapsulera dans une promesse
}

async function asyncFn() {
    try {
        const res = await httpRandomFakeRequest;
        // Cette ligne s'éxecute après le traitement du await;
        return res;
    } 
    
    catch (error) {
        throw error;
    }
}

asyncFnReturnsPromiseAnyway()
.then(res => console.log('RESPONSE VALUE : ' + res))
.catch(err => console.error('ERROR REASON : ' + err))


// STATIC METHODS

/**
 * PROMISE.ALL()
 * @param Promise[]
 **/

Promise.all([
    new Promise((resolve) => setTimeout(() => resolve('value x²'), 1000)),
    (async () => 'good evening')(),
    2
])
.then(result => console.log('Promise.all() res ', result))
.catch(err => console.error('Promise.all() ERROR : ', err))

// Retourne une promesse lorsque toutes les promesses sont tenues, 
// et les classe selon leur ordre de déclaration
// Va dans le .catch() lorsqu'une promesse échoue

/**
 * PROMISE.ALLSETTLED()
 * @param Promise[]
 **/

Promise.allSettled([
    (async () => 'good evening')(),
    new Promise((resolve, reject) => setTimeout(() => reject('error x²'), 2000)),
    2
])
.then(result => console.log('Promise.allsetteled() res ', result))
.catch(err => console.error('Promise.allsetteled() ERROR : ', err)) // Ici le .catch est inutile

// Retourne une promesse : La valeur de résolution de cette promesse est un tableau d'objets respectant la structure :
// Pour les promesse tenues : { status: "fulfilled", value: undefined }
// Pour les rompues : { status: "rejected", reason: undefined }

/**
 * PROMISE.ANY()
 * @param Promise[]
 **/

 Promise.any([
    new Promise((resolve, reject) => setTimeout(() => reject('error x²'), 2000)),
    new Promise((resolve, reject) => setTimeout(() => reject('error x'), 1000)),
])
.then(result => console.log('Promise.any() res ', result))
.catch(err => console.error('Promise.any() ERROR : ', err))

 // Retourne une promesse avec la première valeur tenue
 // Renvoie une erreur si aucune promesse n'est tenue

 /**
 * PROMISE.RACE()
 * @param Promise[]
 **/

 Promise.race([
    new Promise((resolve, reject) => setTimeout(() => resolve('res value'), 2000)),
    new Promise((resolve, reject) => setTimeout(() => reject('error x'), 1000)),
])
.then(result => console.log('Promise.race() res ', result))
.catch(err => console.error('Promise.race() ERROR : ', err))

 // Returns promise with the first resolved or rejected value

 /**
 * PROMISE.TRY()
 **/
 Promise.try(() => 2)
.then(result => console.log('Promise.try() res ', result))
.catch(err => console.error('Promise.try() ERROR : ', err))

 /**
 * PROMISE.WITHRESOLVERS()
 **/

 const promiseWithResolvers = Promise.withResolvers();

 console.log(promiseWithResolvers); // Object { promise: Promise { "pending" }, resolve: (), reject: () }

 promiseWithResolvers.resolve()


</script>
