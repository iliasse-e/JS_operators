<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTTP</title>
</head>
<body>
    
</body>
</html>
<script>

// 1 - Requete POST

const fetchUsers = fetch('https://jsonplaceholder.typicode.com/users');

fetchUsers.then(async reponse => { // Fourni un objet Response
    console.log(reponse.ok);
    console.log(reponse.status);
    console.log(reponse.statusText);
    console.log(reponse.redirected);
    console.log(reponse.type);
    console.log(reponse.url);
    for (const [cle, valeur] of reponse.headers) {
    console.log(`${cle} : ${valeur}`);
    }

    // Parser la réponse
    const body = await reponse.json(); // .json() renvoie une promesse, donc await est necessaire
    // On peut utiliser aussi les méthodes : .text(), .formData(), .blob(), .bytes(), ...
    console.log(body);
    
}).catch(e => console.log(e))



// 2 - Requete POST

const user = {
    name: 'Jean',
    age: 33,
    isAdmin: false
}

const promesse = fetch('https://jsonplaceholder.typicode.com/users', {
    method: 'POST',
    body: JSON.stringify(user),
    headers: {
        'Content-Type': 'application/json'
    }
})

promesse.then(async response => {
    try {
        console.log(response);
        const body = await response.json();
        console.log(body);
        
    } catch (error) {
        console.log(error);
    }  
})

</script>
