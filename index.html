<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau</title>
</head>

</body>
</html>
<script>

// 1 - Declaration

const arr1 = [1, {}, function(){}, [1, 2]];

const arr2 = Array(1, 2, 3);

const arr3 = new Array(1, 3);

const arr4 = Array.from("bonjour") // Array(7) [ "b", "o", "n", "j", "o", "u", "r" ]

const arr5 = Array.from([1, 2, 3], nb => nb + nb) // Array(3) [ 2, 4, 6 ]

const arr6 = Array.of("foo", 2, "bar", true);


// 2 - Comparaison de type

typeof arr1 === "array" // false, elle est de type "object"

Array.isArray(arr1) // true


// 3 - Array.fromAsync()

Array.fromAsync([Promise.resolve(1), Promise.resolve(2), Promise.resolve(3)])
.then((array) => console.log(array));


// 4 - Accéder à une propriété

arr1[1]

arr1.at(1) // ou bien -1 si l'on veut accéder à la dernière propriété du tableau


// 5  Tableau imbriqué

const twoDimensionArray = [[1, 2], [3, 4]]

console.log(twoDimensionArray[0][0], twoDimensionArray.at(1).at(1));


// 6 - Décomposition d'un tableau

const arr7 = ["a", "b", "c"]

let [a, ...chars] = arr7;

const [, b] = arr1 // On saute le premier élément


// 7 - Inverser deux valeurs

let x = "x";
let z = "z";

[x, z] = [z, x] // x = "z" & z = "x"


// 8 - Ajouter élément dans tableau

Array().push() // Ajoute à la fin
Array().unshift() // Ajoute au début

arr1 = [...arr1, 6] // On réassigne le même tableau via le spread operator + la nouvelle valeur

arr1.splice(0, 0, "Bonjour") // 1er param l'index, 2e param le nombre d'élément à delete, 3e param la valeur


// 9 - Supprimer élément dans tableau

Array().pop() // Supprime à la fin
Array().shift() // Supprime au début

arr1.splice(-1, 1) // -1 est le dernier élément du tableau

const [, , ...copie] = arr4 // On délaisse ce qui nous intéresse pas


</script>
